<h2>Registered Students</h2>

<table border="1">

    <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Age</th>
        <th>Department</th>
    </tr>

    {% for student in students %}

    <tr>
        <td>{{ student.name }}</td>
        <td>{{ student.email }}</td>
        <td>{{ student.age }}</td>
        <td>{{ student.department }}</td>
    </tr>

    {% empty %}

    <tr>
        <td colspan="4">No students found</td>
    </tr>

    {% endfor %}
